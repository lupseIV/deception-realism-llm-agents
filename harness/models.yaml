# Model profiles. Harness code asks for a profile by name; only this file
# knows where a model runs. See README.md section 2.
#
# Fields per profile:
#   model        Inspect model string
#   model_args   provider-specific arguments (passed as -M / model_args)
#   max_context  context budget in tokens; the agent history is trimmed to fit
#   max_connections  parallel requests to the model
#   generate     overrides of the shared generation settings below
#   notes        backend, quantization, anything needed to report the condition

generate:                  # shared by every profile, fixed per experiment
  temperature: 0.7         # Qwen3 recommendation for non-thinking mode
  top_p: 0.8
  max_tokens: 1024
  seed: 1234
  max_tool_output: 4096    # bytes of tool output shown to the model

profiles:
  qwen3-8b-local:
    model: ollama/qwen3-8k  # qwen3:8b with num_ctx 8192, see ollama/qwen3-8k.Modelfile
    max_context: 8192       # bench: 100% on the GPU up to 8k
    max_connections: 1
    generate:
      extra_body: {reasoning: {effort: none}}   # Ollama: thinking off
    notes: "Ollama, Q4 (default qwen3:8b tag), local RTX 2070 Super"

  gemini-flash:
    model: google/gemini-2.5-flash
    max_context: 8192         # same budget as the local model (README rule 6)
    max_connections: 1        # free tier is ~10 RPM; keep one request at a time
    generate:
      reasoning_tokens: 0     # Gemini: thinking off (thinking_budget=0), like the local model
    notes: "Google AI free tier, Gemini 2.5 Flash; thinking disabled. For more daily quota use gemini-2.5-flash-lite."

  # Cloud alternative, not used for now (needs OpenRouter credit). Re-enable by
  # uncommenting; see README section 2.
